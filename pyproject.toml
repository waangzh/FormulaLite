[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formulalite"
dynamic = ["version"]
description = "A lightweight image-to-LaTeX OCR system for local and browser inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3,<2",
    "lightning>=2.5,<3",
    "numpy>=2,<3",
    "omegaconf>=2.3,<3",
    "pillow>=11,<13",
    "tensorboard>=2.20,<3",
    "tokenizers>=0.19,<1",
    "torch>=2.6,<3",
    "transformers>=4.40,<5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.version]
path = "src/formulalite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/formulalite"]

[tool.hatch.build.targets.wheel.force-include]
"src/formulalite/data/common_tokens.txt" = "formulalite/data/common_tokens.txt"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
